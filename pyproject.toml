[project]
name = "spiral-test"
version = "0.1.0"
description = "Phone spiral drawing test that measures tremor in Hz and mm, abstains on bad input, and reports its own failure map."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
note = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
spiral = "spiral.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spiral"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
